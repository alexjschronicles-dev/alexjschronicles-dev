<svg xmlns="http://www.w3.org/2000/svg"
     width="900"
     height="420"
     viewBox="0 0 900 420">

<style>

.bg{
fill:#08111d;
}

.card{
fill:#0d1726;
stroke:#33b5ff;
stroke-width:2;
rx:24;
}

.title{
font-size:34px;
font-family:Segoe UI,Arial,sans-serif;
font-weight:bold;
fill:#8fe3ff;
}

.lang{
fill:#ffffff;
font-size:22px;
font-family:Segoe UI,Arial,sans-serif;
}

.percent{
fill:#80d8ff;
font-size:20px;
font-family:Consolas,monospace;
}

.bar-bg{
fill:#19314e;
rx:10;
}

.bar{
rx:10;
filter:url(#glow);
transform-origin:left;
transform:scaleX(0);
animation:grow 1.8s forwards;
}

.bar1{animation-delay:.2s;}
.bar2{animation-delay:.5s;}
.bar3{animation-delay:.8s;}
.bar4{animation-delay:1.1s;}
.bar5{animation-delay:1.4s;}
.bar6{animation-delay:1.7s;}
.bar7{animation-delay:2s;}

.row{
opacity:0;
transform:translateX(-30px);
animation:slide .8s forwards;
}

.r1{animation-delay:.1s;}
.r2{animation-delay:.4s;}
.r3{animation-delay:.7s;}
.r4{animation-delay:1s;}
.r5{animation-delay:1.3s;}
.r6{animation-delay:1.6s;}
.r7{animation-delay:1.9s;}

.spark{
animation:blink 2.5s infinite;
}

@keyframes grow{
to{
transform:scaleX(1);
}
}

@keyframes slide{
to{
opacity:1;
transform:translateX(0);
}
}

@keyframes blink{
50%{
opacity:.2;
}
}

</style>

<defs>

<linearGradient id="js">
<stop offset="0%" stop-color="#ffd54f"/>
<stop offset="100%" stop-color="#ffb300"/>
</linearGradient>

<linearGradient id="ts">
<stop offset="0%" stop-color="#64b5f6"/>
<stop offset="100%" stop-color="#1976d2"/>
</linearGradient>

<linearGradient id="html">
<stop offset="0%" stop-color="#ff8a65"/>
<stop offset="100%" stop-color="#f4511e"/>
</linearGradient>

<linearGradient id="css">
<stop offset="0%" stop-color="#81d4fa"/>
<stop offset="100%" stop-color="#039be5"/>
</linearGradient>

<linearGradient id="react">
<stop offset="0%" stop-color="#80deea"/>
<stop offset="100%" stop-color="#26c6da"/>
</linearGradient>

<linearGradient id="node">
<stop offset="0%" stop-color="#81c784"/>
<stop offset="100%" stop-color="#43a047"/>
</linearGradient>

<linearGradient id="sql">
<stop offset="0%" stop-color="#90caf9"/>
<stop offset="100%" stop-color="#1565c0"/>
</linearGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="4"/>
</filter>

</defs>

<rect width="900" height="420" rx="24" class="bg"/>

<rect x="10"
      y="10"
      width="880"
      height="400"
      class="card"/>

<text x="40"
      y="55"
      class="title">
Most Used Languages
</text>

<g class="row r1">

<text x="40" y="105" class="lang">JavaScript</text>

<text x="820" y="105" class="percent">95%</text>

<rect x="220" y="88"
      width="560"
      height="18"
      class="bar-bg"/>

<rect x="220"
      y="88"
      width="532"
      height="18"
      fill="url(#js)"
      class="bar bar1"/>

</g>

<g class="row r2">

<text x="40" y="150" class="lang">TypeScript</text>

<text x="820" y="150" class="percent">90%</text>

<rect x="220" y="133"
      width="560"
      height="18"
      class="bar-bg"/>

<rect x="220"
      y="133"
      width="504"
      height="18"
      fill="url(#ts)"
      class="bar bar2"/>

</g>

<g class="row r3">

<text x="40" y="195" class="lang">HTML</text>

<text x="820" y="195" class="percent">95%</text>

<rect x="220" y="178"
      width="560"
      height="18"
      class="bar-bg"/>

<rect x="220"
      y="178"
      width="532"
      height="18"
      fill="url(#html)"
      class="bar bar3"/>

</g>

<g class="row r4">

<text x="40" y="240" class="lang">CSS</text>

<text x="820" y="240" class="percent">92%</text>

<rect x="220" y="223"
      width="560"
      height="18"
      class="bar-bg"/>

<rect x="220"
      y="223"
      width="515"
      height="18"
      fill="url(#css)"
      class="bar bar4"/>

</g>

<g class="row r5">

<text x="40" y="285" class="lang">React</text>

<text x="820" y="285" class="percent">85%</text>

<rect x="220" y="268"
      width="560"
      height="18"
      class="bar-bg"/>

<rect x="220"
      y="268"
      width="476"
      height="18"
      fill="url(#react)"
      class="bar bar5"/>

</g>

<g class="row r6">

<text x="40" y="330" class="lang">Node.js</text>

<text x="820" y="330" class="percent">94%</text>

<rect x="220" y="313"
      width="560"
      height="18"
      class="bar-bg"/>

<rect x="220"
      y="313"
      width="526"
      height="18"
      fill="url(#node)"
      class="bar bar6"/>

</g>

<g class="row r7">

<text x="40" y="375" class="lang">SQL</text>

<text x="820" y="375" class="percent">82%</text>

<rect x="220" y="358"
      width="560"
      height="18"
      class="bar-bg"/>

<rect x="220"
      y="358"
      width="459"
      height="18"
      fill="url(#sql)"
      class="bar bar7"/>

</g>

<circle cx="840" cy="45" r="3" fill="#6fdcff" class="spark"/>
<circle cx="810" cy="80" r="2" fill="#6fdcff" class="spark"/>
<circle cx="770" cy="55" r="2" fill="#6fdcff" class="spark"/>
<circle cx="90" cy="380" r="2" fill="#6fdcff" class="spark"/>
<circle cx="130" cy="395" r="3" fill="#6fdcff" class="spark"/>

</svg>
