<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">

<defs>

<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#071426"/>
<stop offset="100%" stop-color="#102540"/>
</linearGradient>

<linearGradient id="bar">
<stop offset="0%" stop-color="#00C6FF"/>
<stop offset="100%" stop-color="#0072FF"/>
</linearGradient>

</defs>

<rect width="900" height="420" rx="28" fill="url(#bg)"/>

<text x="40"
y="55"
font-size="34"
font-family="Segoe UI"
font-weight="bold"
fill="#7FDBFF">

💻 Most Used Languages

</text>

<!-- JavaScript -->

<text x="40" y="105" fill="white" font-size="22">JavaScript</text>

<rect x="240" y="90" width="560" height="18" rx="9" fill="#16304F"/>

<rect x="240" y="90"
width="0"
height="18"
rx="9"
fill="url(#bar)">

<animate attributeName="width"
from="0"
to="530"
dur="1.5s"
fill="freeze"/>

</rect>

<text x="820" y="105"
fill="#7FDBFF"
font-size="18">95%</text>

<!-- TypeScript -->

<text x="40" y="155" fill="white" font-size="22">TypeScript</text>

<rect x="240" y="140" width="560" height="18" rx="9" fill="#16304F"/>

<rect x="240" y="140"
width="0"
height="18"
rx="9"
fill="url(#bar)">

<animate attributeName="width"
from="0"
to="504"
begin=".2s"
dur="1.5s"
fill="freeze"/>

</rect>

<text x="820" y="155"
fill="#7FDBFF"
font-size="18">90%</text>

<!-- HTML -->

<text x="40" y="205" fill="white" font-size="22">HTML</text>

<rect x="240" y="190" width="560" height="18" rx="9" fill="#16304F"/>

<rect x="240" y="190"
width="0"
height="18"
rx="9"
fill="url(#bar)">

<animate attributeName="width"
from="0"
to="532"
begin=".4s"
dur="1.5s"
fill="freeze"/>

</rect>

<text x="820" y="205"
fill="#7FDBFF"
font-size="18">95%</text>

<!-- CSS -->

<text x="40" y="255" fill="white" font-size="22">CSS</text>

<rect x="240" y="240" width="560" height="18" rx="9" fill="#16304F"/>

<rect x="240" y="240"
width="0"
height="18"
rx="9"
fill="url(#bar)">

<animate attributeName="width"
from="0"
to="515"
begin=".6s"
dur="1.5s"
fill="freeze"/>

</rect>

<text x="820" y="255"
fill="#7FDBFF"
font-size="18">92%</text>

<!-- React -->

<text x="40" y="305" fill="white" font-size="22">React</text>

<rect x="240" y="290" width="560" height="18" rx="9" fill="#16304F"/>

<rect x="240" y="290"
width="0"
height="18"
rx="9"
fill="url(#bar)">

<animate attributeName="width"
from="0"
to="476"
begin=".8s"
dur="1.5s"
fill="freeze"/>

</rect>

<text x="820" y="305"
fill="#7FDBFF"
font-size="18">85%</text>

<!-- Node.js -->

<text x="40" y="355" fill="white" font-size="22">Node.js</text>

<rect x="240" y="340" width="560" height="18" rx="9" fill="#16304F"/>

<rect x="240" y="340"
width="0"
height="18"
rx="9"
fill="url(#bar)">

<animate attributeName="width"
from="0"
to="526"
begin="1s"
dur="1.5s"
fill="freeze"/>

</rect>

<text x="820" y="355"
fill="#7FDBFF"
font-size="18">94%</text>

</svg>
