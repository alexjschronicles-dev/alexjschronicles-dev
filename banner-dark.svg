<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280">
<defs>
  <!-- Red, Black, White Gradients -->
  <linearGradient id="bbg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#050505"/>
    <stop offset="50%"  stop-color="#140708"/>
    <stop offset="100%" stop-color="#080808"/>
  </linearGradient>
  
  <linearGradient id="btxt" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#ff1e42"/>
    <stop offset="50%"  stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#ff1e42"/>
  </linearGradient>

  <linearGradient id="bsub" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#ff4d6d"/>
    <stop offset="50%"  stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#ff4d6d"/>
  </linearGradient>

  <linearGradient id="bline" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="transparent"/>
    <stop offset="25%"  stop-color="#ff1e42"/>
    <stop offset="50%"  stop-color="#ffffff"/>
    <stop offset="75%"  stop-color="#ff1e42"/>
    <stop offset="100%" stop-color="transparent"/>
  </linearGradient>

  <linearGradient id="bred" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="transparent"/>
    <stop offset="35%"  stop-color="#ff1e42"/>
    <stop offset="65%"  stop-color="#ff1e42"/>
    <stop offset="100%" stop-color="transparent"/>
  </linearGradient>

  <!-- Glowing Filters -->
  <filter id="bglow" x="-20%" y="-40%" width="140%" height="180%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="bsglow" x="-30%" y="-60%" width="160%" height="220%">
    <feGaussianBlur stdDeviation="16" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="bbrk" x="-40%" y="-60%" width="180%" height="220%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <clipPath id="bclip">
    <rect width="900" height="280" rx="0"/>
  </clipPath>
</defs>

<style>
.bstar{animation:btwinkle var(--d,3s) var(--e,0s) infinite ease-in-out;}
@keyframes btwinkle{0%,100%{opacity:.15}50%{opacity:.95}}

.bshine{animation:bsweep 7s 1s infinite linear;}
@keyframes bsweep{from{transform:translateX(-300px) skewX(-20deg)}to{transform:translateX(1300px) skewX(-20deg)}}

.btitle{animation:bpulse 4s infinite ease-in-out;}
@keyframes bpulse{0%,100%{filter:url(#bglow)}50%{filter:url(#bsglow)}}

.bbrkt{animation:bbp 3s infinite ease-in-out;}
@keyframes bbp{0%,100%{opacity:.6}50%{opacity:1}}

.bdot{animation:bdp var(--d,2s) var(--e,0s) infinite ease-in-out;}
@keyframes bdp{0%,100%{opacity:.3;r:2.5}50%{opacity:1;r:4.5}}

/* Circuit trace animation */
.btrace{stroke-dasharray:120;stroke-dashoffset:120;animation:bdraw 3s var(--e,0s) forwards ease-out;}
@keyframes bdraw{to{stroke-dashoffset:0}}
</style>

<!-- Deep Black/Crimson Background -->
<rect width="900" height="280" fill="url(#bbg)"/>

<!-- Stars / Particles (Red & White) -->
<circle class="bstar" cx="50"  cy="20"  r="1.5" fill="#ff4d6d" style="--d:2.3s;--e:.2s"/>
<circle class="bstar" cx="830" cy="15"  r="1"   fill="#ffffff" style="--d:3.4s;--e:.8s"/>
<circle class="bstar" cx="780" cy="50"  r="1.5" fill="#ff1e42" style="--d:2.8s;--e:1.1s"/>
<circle class="bstar" cx="120" cy="250" r="1.2" fill="#ffffff" style="--d:4.0s;--e:.4s"/>
<circle class="bstar" cx="870" cy="200" r="1.5" fill="#ff1e42" style="--d:3.1s;--e:1.6s"/>
<circle class="bstar" cx="30"  cy="140" r="1"   fill="#ffffff" style="--d:2.5s;--e:.7s"/>
<circle class="bstar" cx="850" cy="260" r="1.5" fill="#ff4d6d" style="--d:3.7s;--e:1.4s"/>
<circle class="bstar" cx="680" cy="10"  r="1.2" fill="#ff1e42" style="--d:2.2s;--e:2.0s"/>
<circle class="bstar" cx="450" cy="270" r="1.5" fill="#ffffff" style="--d:4.2s;--e:.6s"/>
<circle class="bstar" cx="310" cy="25"  r="1"   fill="#ff4d6d" style="--d:3.3s;--e:1.8s"/>
<circle class="bstar" cx="200" cy="260" r="1.5" fill="#ffffff" style="--d:2.9s;--e:.3s"/>
<circle class="bstar" cx="620" cy="265" r="1"   fill="#ff1e42" style="--d:3.6s;--e:2.2s"/>
<circle class="bstar" cx="750" cy="240" r="1.2" fill="#ffffff" style="--d:2.4s;--e:1.3s"/>
<circle class="bstar" cx="550" cy="12"  r="1.5" fill="#ff4d6d" style="--d:4.0s;--e:.5s"/>

<!-- Circuit traces (Crimson Red & White) -->
<g clip-path="url(#bclip)">
  <path class="btrace" d="M0,80 L80,80 L80,40 L180,40" fill="none" stroke="#ff1e42" stroke-width="0.8" stroke-opacity=".35" style="--e:.5s"/>
  <path class="btrace" d="M900,180 L820,180 L820,220 L720,220" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-opacity=".25" style="--e:1s"/>
  <path class="btrace" d="M0,200 L60,200 L60,240 L140,240" fill="none" stroke="#ff1e42" stroke-width="0.8" stroke-opacity=".3" style="--e:1.5s"/>
  <path class="btrace" d="M900,60 L840,60 L840,100 L760,100" fill="none" stroke="#ff4d6d" stroke-width="0.6" stroke-opacity=".25" style="--e:.8s"/>
</g>

<!-- Corner brackets in Crimson Red -->
<path class="bbrkt" d="M20,20 L20,55 M20,20 L55,20" fill="none" stroke="#ff1e42" stroke-width="2.5" stroke-linecap="round" filter="url(#bbrk)"/>
<path class="bbrkt" d="M880,20 L880,55 M880,20 L845,20" fill="none" stroke="#ff1e42" stroke-width="2.5" stroke-linecap="round" filter="url(#bbrk)"/>
<path class="bbrkt" d="M20,260 L20,225 M20,260 L55,260" fill="none" stroke="#ff1e42" stroke-width="2.5" stroke-linecap="round" filter="url(#bbrk)"/>
<path class="bbrkt" d="M880,260 L880,225 M880,260 L845,260" fill="none" stroke="#ff1e42" stroke-width="2.5" stroke-linecap="round" filter="url(#bbrk)"/>

<!-- Shimmer sweep -->
<g clip-path="url(#bclip)">
  <rect class="bshine" x="-200" y="0" width="80" height="280" fill="white" opacity=".05"/>
</g>

<!-- Decorative top and bottom red/white lines -->
<rect x="0" y="0" width="900" height="2.5" fill="url(#bline)"/>
<rect x="0" y="277.5" width="900" height="2.5" fill="url(#bline)"/>

<!-- Horizontal divider lines around title -->
<rect x="180" y="112" width="540" height="1" fill="url(#bred)" opacity=".7"/>
<rect x="180" y="168" width="540" height="1" fill="url(#bred)" opacity=".7"/>

<!-- Main title backdrop -->
<text x="450" y="155" text-anchor="middle"
      font-size="74" font-family="Segoe UI,Arial,sans-serif" font-weight="900"
      fill="#ff1e42" opacity=".12">ALEX JS</text>

<!-- Main title -->
<text class="btitle" x="450" y="155" text-anchor="middle"
      font-size="74" font-family="Segoe UI,Arial,sans-serif" font-weight="900"
      fill="url(#btxt)" filter="url(#bglow)">ALEX JS</text>

<!-- Subtitle -->
<text x="450" y="196" text-anchor="middle"
      font-size="15" font-family="Segoe UI,Arial,sans-serif" font-weight="700"
      fill="url(#bsub)" letter-spacing="3">DISCORD BOT DEVELOPER  •  FRONTEND WEB DEVELOPER  •  CHRONICLES</text>

<!-- Floating glow dots on title edges -->
<circle class="bdot" cx="180" cy="140" r="3.5" fill="#ff1e42" style="--d:2.5s;--e:0s" filter="url(#bbrk)"/>
<circle class="bdot" cx="720" cy="140" r="3.5" fill="#ff1e42" style="--d:2.5s;--e:1.2s" filter="url(#bbrk)"/>
<circle class="bdot" cx="180" cy="162" r="2.5" fill="#ffffff" style="--d:3s;--e:.6s" filter="url(#bbrk)"/>
<circle class="bdot" cx="720" cy="162" r="2.5" fill="#ffffff" style="--d:3s;--e:1.8s" filter="url(#bbrk)"/>

<!-- Status indicator dots (top right) in white and red shades -->
<circle cx="858" cy="26" r="4" fill="#ffffff" opacity=".95"/>
<circle cx="872" cy="26" r="4" fill="#ff4d6d" opacity=".9"/>
<circle cx="886" cy="26" r="4" fill="#ff1e42" opacity=".95"/>

</svg>
