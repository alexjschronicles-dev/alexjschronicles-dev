<stop offset="100%" stop-color="#102540"/>
</linearGradient>

<linearGradient id="gold">
<stop offset="0%" stop-color="#FFD54F"/>
<stop offset="100%" stop-color="#FF9800"/>
</linearGradient>

<linearGradient id="blue">
<stop offset="0%" stop-color="#00C6FF"/>
