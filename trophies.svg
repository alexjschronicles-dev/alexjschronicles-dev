<svg xmlns="http://www.w3.org/2000/svg"
     width="900"
     height="420"
     viewBox="0 0 900 420">

<style>
.bg{
fill:#08111d;
}

.card{
fill:#0d1726;
stroke:#35b6ff;
stroke-width:2;
rx:24;
}

.title{
font-family:Segoe UI,Arial,sans-serif;
font-size:34px;
font-weight:bold;
fill:#9ae8ff;
}

.cell{
fill:#12253f;
stroke:#2fb4ff;
stroke-width:2;
rx:18;
opacity:0;
transform-origin:center;
animation:pop .7s forwards;
}

.c1{animation-delay:.2s;}
.c2{animation-delay:.5s;}
.c3{animation-delay:.8s;}
.c4{animation-delay:1.1s;}
.c5{animation-delay:1.4s;}
.c6{animation-delay:1.7s;}

.icon{
font-size:46px;
font-family:Segoe UI Emoji;
}

.rank{
fill:#ffffff;
font-size:22px;
font-family:Segoe UI;
font-weight:bold;
}

.desc{
fill:#84d8ff;
font-size:16px;
font-family:Segoe UI;
}

.shine{
fill:url(#shine);
opacity:.4;
animation:sweep 4s linear infinite;
}

.star{
animation:blink 2.5s infinite;
}

@keyframes pop{
0%{
opacity:0;
transform:scale(.4);
}
70%{
transform:scale(1.08);
}
100%{
opacity:1;
transform:scale(1);
}
}

@keyframes blink{
50%{
opacity:.2;
}
}

@keyframes sweep{
0%{
transform:translateX(-260px);
}
100%{
transform:translateX(960px);
}
}
</style>

<defs>

<linearGradient id="gold">
<stop offset="0%" stop-color="#ffe082"/>
<stop offset="100%" stop-color="#ffb300"/>
</linearGradient>

<linearGradient id="silver">
<stop offset="0%" stop-color="#eceff1"/>
<stop offset="100%" stop-color="#90a4ae"/>
</linearGradient>

<linearGradient id="blue">
<stop offset="0%" stop-color="#00d4ff"/>
<stop offset="100%" stop-color="#448aff"/>
</linearGradient>

<linearGradient id="shine">
<stop offset="0%" stop-color="white" stop-opacity="0"/>
<stop offset="50%" stop-color="white" stop-opacity=".9"/>
<stop offset="100%" stop-color="white" stop-opacity="0"/>
</linearGradient>

</defs>

<rect width="900" height="420" rx="24" class="bg"/>
<rect x="10" y="10" width="880" height="400" class="card"/>

<text x="40" y="55" class="title">
🏆 Achievements & Milestones
</text>

<!-- Row 1 -->

<g>

<rect x="40" y="90" width="240" height="120" class="cell c1"/>

<text x="145" y="145" class="icon">👑</text>

<text x="85" y="178" class="rank">
Chronicles Founder
</text>

<text x="70" y="198" class="desc">
Community Leadership
</text>

</g>

<g>

<rect x="330" y="90" width="240" height="120" class="cell c2"/>

<text x="435" y="145" class="icon">🤖</text>

<text x="390" y="178" class="rank">
Bot Architect
</text>

<text x="365" y="198" class="desc">
Discord.js Specialist
</text>

</g>

<g>

<rect x="620" y="90" width="240" height="120" class="cell c3"/>

<text x="725" y="145" class="icon">💎</text>

<text x="675" y="178" class="rank">
Premium Projects
</text>

<text x="675" y="198" class="desc">
Production Ready
</text>

</g>

<!-- Row 2 -->

<g>

<rect x="40" y="250" width="240" height="120" class="cell c4"/>

<text x="145" y="305" class="icon">🚀</text>

<text x="98" y="338" class="rank">
Fast Developer
</text>

<text x="85" y="358" class="desc">
Continuous Learning
</text>

</g>

<g>

<rect x="330" y="250" width="240" height="120" class="cell c5"/>

<text x="435" y="305" class="icon">🌐</text>

<text x="375" y="338" class="rank">
Frontend Expert
</text>

<text x="380" y="358" class="desc">
Modern Web UI
</text>

</g>

<g>

<rect x="620" y="250" width="240" height="120" class="cell c6"/>

<text x="725" y="305" class="icon">⭐</text>

<text x="688" y="338" class="rank">
Open Source
</text>

<text x="695" y="358" class="desc">
Growing Every Day
</text>

</g>

<!-- Shine -->

<rect x="-220"
      y="0"
      width="180"
      height="420"
      class="shine"
      transform="rotate(-20 0 0)"/>

<!-- Stars -->

<circle cx="820" cy="40" r="3" fill="#7ee8ff" class="star"/>
<circle cx="790" cy="70" r="2" fill="#7ee8ff" class="star"/>
<circle cx="850" cy="90" r="2" fill="#7ee8ff" class="star"/>
<circle cx="70" cy="395" r="2" fill="#7ee8ff" class="star"/>
<circle cx="120" cy="385" r="3" fill="#7ee8ff" class="star"/>

</svg>
