<svg xmlns="http://www.w3.org/2000/svg"
     width="900"
     height="420"
     viewBox="0 0 900 420">

<style>
.background{
fill:#07111f;
}

.card{
fill:#0b1628;
stroke:#2aa8ff;
stroke-width:2;
rx:22;
}

.title{
fill:#7fd6ff;
font-size:34px;
font-family:Segoe UI,Arial,sans-serif;
font-weight:bold;
}

.label{
fill:#8fcfff;
font-size:22px;
font-family:Segoe UI,Arial,sans-serif;
}

.value{
fill:white;
font-size:24px;
font-family:Consolas,monospace;
font-weight:bold;
}

.small{
fill:#6db7ff;
font-size:18px;
font-family:Segoe UI;
}

.progress-bg{
fill:#16304f;
rx:8;
}

.progress{
fill:url(#grad);
rx:8;
}

.glow{
filter:url(#glow);
}

.ring{
fill:none;
stroke:#123d67;
stroke-width:18;
}

.ring-progress{
fill:none;
stroke:url(#grad);
stroke-width:18;
stroke-linecap:round;
stroke-dasharray:628;
stroke-dashoffset:628;
animation:ring 3s forwards;
}

.row{
opacity:0;
transform:translateX(-40px);
animation:slide .8s forwards;
}

.r1{animation-delay:.2s;}
.r2{animation-delay:.5s;}
.r3{animation-delay:.8s;}
.r4{animation-delay:1.1s;}
.r5{animation-delay:1.4s;}

.bar{
width:0;
animation:grow 2s forwards;
}

.b1{animation-delay:.5s;}
.b2{animation-delay:.8s;}
.b3{animation-delay:1.1s;}
.b4{animation-delay:1.4s;}
.b5{animation-delay:1.7s;}

.rank{
font-size:70px;
font-weight:bold;
fill:url(#grad);
font-family:Segoe UI;
opacity:0;
animation:fade .8s forwards;
animation-delay:1s;
}

.spark{
animation:twinkle 2s infinite;
}

@keyframes grow{
to{
width:100%;
}
}

@keyframes slide{
to{
opacity:1;
transform:translateX(0);
}
}

@keyframes fade{
to{
opacity:1;
}
}

@keyframes ring{
to{
stroke-dashoffset:126;
}
}

@keyframes twinkle{
50%{
opacity:.2;
}
}

</style>

<defs>

<linearGradient id="grad">
<stop offset="0%" stop-color="#00d2ff"/>
<stop offset="100%" stop-color="#4facfe"/>
</linearGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="6" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

</defs>

<rect width="900" height="420" rx="28" class="background"/>

<rect x="10" y="10" width="880" height="400" class="card"/>

<text x="40" y="55" class="title">
GitHub Statistics
</text>

<circle cx="180" cy="220"
        r="100"
        class="ring"/>

<circle cx="180"
        cy="220"
        r="100"
        class="ring-progress glow"
        transform="rotate(-90 180 220)"/>

<text x="145" y="205"
      class="small">
Developer
</text>

<text x="126"
      y="250"
      class="rank">
A+
</text>

<g class="row r1">

<text x="360" y="95" class="label">
Repositories
</text>

<text x="760" y="95" class="value">
25+
</text>

<rect x="360"
      y="110"
      width="420"
      height="14"
      class="progress-bg"/>

<rect x="360"
      y="110"
      width="360"
      height="14"
      class="progress progress b1"/>

</g>

<g class="row r2">

<text x="360" y="155" class="label">
Discord Bots
</text>

<text x="760" y="155" class="value">
15+
</text>

<rect x="360"
      y="170"
      width="420"
      height="14"
      class="progress-bg"/>

<rect x="360"
      y="170"
      width="390"
      height="14"
      class="progress progress b2"/>

</g>

<g class="row r3">

<text x="360" y="215" class="label">
Frontend Projects
</text>

<text x="760" y="215" class="value">
12+
</text>

<rect x="360"
      y="230"
      width="420"
      height="14"
      class="progress-bg"/>

<rect x="360"
      y="230"
      width="330"
      height="14"
      class="progress progress b3"/>

</g>

<g class="row r4">

<text x="360" y="275" class="label">
Open Source
</text>

<text x="760" y="275" class="value">
Growing
</text>

<rect x="360"
      y="290"
      width="420"
      height="14"
      class="progress-bg"/>

<rect x="360"
      y="290"
      width="280"
      height="14"
      class="progress progress b4"/>

</g>

<g class="row r5">

<text x="360" y="335" class="label">
Coding Passion
</text>

<text x="760" y="335" class="value">
100%
</text>

<rect x="360"
      y="350"
      width="420"
      height="14"
      class="progress-bg"/>

<rect x="360"
      y="350"
      width="420"
      height="14"
      class="progress progress b5"/>

</g>

<circle cx="840" cy="55" r="4" fill="#4fc3ff" class="spark"/>
<circle cx="820" cy="82" r="3" fill="#8efcff" class="spark"/>
<circle cx="790" cy="45" r="2" fill="#4fc3ff" class="spark"/>
<circle cx="70" cy="370" r="3" fill="#4fc3ff" class="spark"/>
<circle cx="120" cy="390" r="2" fill="#8efcff" class="spark"/>

</svg>
